# Deploys the Paystack Edge Functions (supabase/functions) to the hosted project and sets the
# PAYSTACK_SECRET_KEY Supabase secret from the GitHub repository secret of the same name (docs/PAYMENTS.md).
# Needs SUPABASE_ACCESS_TOKEN (already used by supabase-deploy.yml). PAYSTACK_SECRET_KEY is optional:
# when it is empty the secret step is skipped with a notice (the functions still deploy).
name: Supabase Edge Functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/supabase-functions.yml']
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      PROJECT_REF: twwttirvesbwjvzjmenp
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN in Settings → Secrets and variables → Actions"
            exit 1
          fi
      - name: Set PAYSTACK_SECRET_KEY
        run: |
          if [ -z "$PAYSTACK_SECRET_KEY" ]; then
            echo "::notice::PAYSTACK_SECRET_KEY repository secret is empty: skipped. Add it, then re-run this workflow."
          else
            # passed through the environment, never echoed
            supabase secrets set --project-ref "$PROJECT_REF" PAYSTACK_SECRET_KEY="$PAYSTACK_SECRET_KEY" > /dev/null
            echo "PAYSTACK_SECRET_KEY set."
          fi
      - name: Deploy functions
        run: supabase functions deploy paystack-verify paystack-webhook --project-ref "$PROJECT_REF" --use-api
