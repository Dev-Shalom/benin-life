# Deploys the Edge Functions (supabase/functions) to the hosted project and sets the PAYSTACK_SECRET_KEY,
# VAPID_PRIVATE_KEY and VAPID_SUBJECT Supabase secrets from the GitHub repository secrets of the same names
# (docs/PAYMENTS.md, docs/BILLBOARDS.md). Needs SUPABASE_ACCESS_TOKEN (already used by supabase-deploy.yml).
# The other secrets are optional: an empty one is skipped with a notice (the functions still deploy).
name: Supabase Edge Functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/supabase-functions.yml']
  workflow_dispatch:
  # Re-sync the secrets daily, so a key changed in GitHub (test -> live) reaches Supabase without a code push.
  schedule:
    - cron: '23 4 * * *'

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      PROJECT_REF: twwttirvesbwjvzjmenp
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN in Settings → Secrets and variables → Actions"
            exit 1
          fi
      - name: Set PAYSTACK_SECRET_KEY
        run: |
          if [ -z "$PAYSTACK_SECRET_KEY" ]; then
            echo "::notice::PAYSTACK_SECRET_KEY repository secret is empty: skipped. Add it, then re-run this workflow."
          else
            # passed through the environment, never echoed
            supabase secrets set --project-ref "$PROJECT_REF" PAYSTACK_SECRET_KEY="$PAYSTACK_SECRET_KEY" > /dev/null
            echo "PAYSTACK_SECRET_KEY set."
          fi
      - name: Set VAPID secrets (admin Web Push)
        run: |
          if [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "::notice::VAPID_PRIVATE_KEY repository secret is empty: skipped. Admin phone notifications stay off until it is added (docs/BILLBOARDS.md)."
          else
            # passed through the environment, never echoed
            supabase secrets set --project-ref "$PROJECT_REF" VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" > /dev/null
            if [ -n "$VAPID_SUBJECT" ]; then
              supabase secrets set --project-ref "$PROJECT_REF" VAPID_SUBJECT="$VAPID_SUBJECT" > /dev/null
            fi
            echo "VAPID secrets set."
          fi
      - name: Deploy functions
        run: supabase functions deploy paystack-verify paystack-webhook admin-push billboard-refund admin-delete-user --project-ref "$PROJECT_REF" --use-api
